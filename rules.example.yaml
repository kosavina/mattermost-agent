# Copy this file to rules.yaml and edit it. The names below are made up.
#
# Rules are checked from top to bottom, and the first match wins. A post is logged either way.
# Every condition a rule sets must hold; within a list, any one item is enough.
#
#   kind      dm, group_dm, mention, thread_reply or channel
#   channels  the name in the channel's URL (town-square), not its title (Town Square)
#   from      usernames, without the @. Your own posts match only a rule that lists you here
#   keywords  case-insensitive; part of a word counts, so "metric" also finds "metrics"
#   scenario  a label for later milestones; it is only logged for now
#
# Quote words that YAML reads as something else: "on", "off", "yes", "no", "null", or a number.
rules:
  - name: dm-from-anyone
    kind: dm
    scenario: intake
  - name: mentions-me
    kind: mention
    scenario: intake
  - name: analytics-keywords
    channels: [analytics]
    from: [example.user]
    keywords: [dashboard, metric]
    scenario: intake

limits:
  # At most this many matches in any 60 minutes. Further matches are logged as cap_hit.
  matches_per_hour: 20
