[project]
name = "mattermost-agent"
version = "0.1.0"
description = "Mattermost listener: groups matching posts into jobs for an agent, in dry run"
readme = "README.md"
authors = [
    { name = "Kirill Savina", email = "99422083+kosavina@users.noreply.github.com" }
]
requires-python = "==3.15.2"
dependencies = [
    "httpx2>=2.16.0",
    "pyyaml>=6.0.3",
    "websockets>=17.4",
]

[project.scripts]
mattermost-agent = "mattermost_agent.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "ty==0.0.99",
]
# The processor runs natively on the Mac and needs these; the listener's container does not, and
# some of them (zstandard, through langgraph) have no Linux wheel for this Python, so the
# Dockerfile installs with --no-default-groups.
processor = [
    "langgraph==1.2.20",
    "langgraph-checkpoint-sqlite==3.1.3",
    "pydantic>=2.14.3",
]

[tool.uv]
default-groups = ["dev", "processor"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert is how pytest works; tests use fake secrets

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "live: runs the real agents on the Mac; skipped unless AGENT_LIVE=1, never in CI",
]
filterwarnings = [
    # langsmith, pulled in by langgraph, is not yet ready for Python 3.16; not our code.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]

[tool.ty.terminal]
error-on-warning = true
